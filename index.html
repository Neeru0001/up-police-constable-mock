<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UP Police Constable Mock Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f2f2f2;margin:0;padding:10px}
h2{text-align:center}
#timer{text-align:center;color:red;font-size:18px;margin-bottom:10px}
#box{background:#fff;padding:15px;border-radius:5px}
.option{margin:8px 0}
button{padding:10px 14px;margin:5px;font-size:15px}
#result{display:none;background:#fff;padding:15px;border-radius:5px}
</style>
</head>

<body>

<h2>UP Police Constable Mock Test</h2>
<div id="timer">Time Left: 120:00</div>

<div id="box">
<p id="qno"></p>
<p id="qtext"></p>
<div id="options"></div>

<button onclick="prevQ()">Previous</button>
<button onclick="nextQ()">Next</button>
<button onclick="submitTest()">Submit Test</button>
</div>

<div id="result"></div>

<script>
const questions = [
{
q:"United Provinces was renamed Uttar Pradesh in which year?",
o:["1947","1950","1956","1960"],
a:1
},
{
q:"Cat : Meow :: Dog : ?",
o:["Bark","Bleat","Roar","Neigh"],
a:0
},
{
q:"What is 25% of 200?",
o:["25","40","50","75"],
a:2
},
{
q:"‘सुंदर’ शब्द कौन-सा विशेषण है?",
o:["संख्यावाचक","गुणवाचक","परिमाणवाचक","सार्वनामिक"],
a:1
}
];

let index=0;
let answers=new Array(questions.length).fill(null);

function loadQ(){
document.getElementById("qno").innerText =
"Question "+(index+1)+" of "+questions.length;
document.getElementById("qtext").innerText = questions[index].q;

let html="";
questions[index].o.forEach((op,i)=>{
html+=`
<div class="option">
<input type="radio" name="opt" value="${i}"
${answers[index]===i?"checked":""}>
${op}
</div>`;
});
document.getElementById("options").innerHTML=html;
}

function nextQ(){
save();
if(index<questions.length-1){index++;loadQ();}
}

function prevQ(){
save();
if(index>0){index--;loadQ();}
}

function save(){
let sel=document.querySelector('input[name="opt"]:checked');
answers[index]=sel?parseInt(sel.value):null;
}

let time=120*60;
setInterval(()=>{
let m=Math.floor(time/60);
let s=time%60;
document.getElementById("timer").innerText=
"Time Left: "+m+":"+(s<10?"0"+s:s);
if(time<=0) submitTest();
time--;
},1000);

function submitTest(){
save();
let score=0;
questions.forEach((q,i)=>{
if(answers[i]!==null){
if(answers[i]===q.a) score+=2;
else score-=0.5;
}
});
document.getElementById("box").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("result").innerHTML=
"<h3>Result</h3><p><b>Score:</b> "+score+"</p>";
}

loadQ();
</script>

</body>
</html>
